[package]
name = "soloist-mpris"
version = "0.1.0"
edition = "2024"
description = "MPRIS bridge for Spotify Soloist, used by the Chorus Plasma widget"
license = "GPL-3.0-or-later"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync", "fs"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
